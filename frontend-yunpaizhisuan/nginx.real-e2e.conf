map $http_x_forwarded_proto $hsts_header {
  https "max-age=31536000; includeSubDomains";
  default "";
}

server {
  listen 80;
  server_name _;
  client_max_body_size 200m;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Strict-Transport-Security $hsts_header always;

  error_page 413 = @frontend_payload_too_large;

  location @frontend_payload_too_large {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 413 '{"success":false,"data":null,"errors":[{"code":"PAYLOAD_TOO_LARGE","message":"Request body is too large; gateway limit is 200 MiB"}]}';
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security $hsts_header always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri =404;
  }

  location = /mockServiceWorker.js {
    add_header Cache-Control "no-store" always;
    return 410;
  }

  location = /historical-order-catalog.json {
    alias /srv/yunpai-business-tracking/historical-order-catalog.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD {
      deny all;
    }
  }

  location /uploads/ {
    alias /srv/yunpai-business-tracking/uploads/;
    autoindex off;
    types {
      text/csv csv;
      text/plain txt log md;
      application/json json;
      application/pdf pdf;
      image/png png;
      image/jpeg jpg jpeg;
      image/gif gif;
      image/webp webp;
      image/bmp bmp;
    }
    default_type application/octet-stream;
    add_header Cache-Control "private, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD {
      deny all;
    }
  }

  location /history-bom/ {
    alias /srv/yunpai-business-tracking/history-bom/;
    autoindex off;
    add_header Cache-Control "private, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD {
      deny all;
    }
  }

  location /run-config/ {
    alias /srv/yunpai-business-tracking/run-config/;
    autoindex off;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD {
      deny all;
    }
  }

  location = /api {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 404 '{"success":false,"data":null,"errors":[{"code":"NOT_FOUND","message":"API route requires a concrete /api/* path"}]}';
  }

  # m0 表格文档 HTML 预览：仅同源 iframe 内嵌，其余 API 仍保持 X-Frame-Options DENY
  location ~ ^/api/m0/import/batch/[^/]+/documents/[0-9]+/preview\.html$ {
    proxy_http_version 1.1;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Origin $http_origin;
    proxy_set_header Referer $http_referer;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_set_header Connection "";
    proxy_pass http://api-gateway:8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  # m0 文档原始文件流（PDF/图片 iframe 预览）：仅同源内嵌
  location ~ ^/api/m0/documents/[0-9]+/file$ {
    proxy_http_version 1.1;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Origin $http_origin;
    proxy_set_header Referer $http_referer;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_set_header Connection "";
    proxy_pass http://api-gateway:8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  # m0 批次文档原始文件流（PDF/图片 iframe 预览）：仅同源内嵌
  location ~ ^/api/m0/import/batch/[^/]+/documents/[0-9]+/file$ {
    proxy_http_version 1.1;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Origin $http_origin;
    proxy_set_header Referer $http_referer;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_set_header Connection "";
    proxy_pass http://api-gateway:8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  # M0 parser compatibility file stream: same-origin PDF/image previews only.
  location ~ ^/api/m0/parser-compat/files/[^/]+$ {
    proxy_http_version 1.1;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Origin $http_origin;
    proxy_set_header Referer $http_referer;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_set_header Connection "";
    proxy_pass http://api-gateway:8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  # M2 制品预览（HTML 表格/文档 + 原始 PDF/图片）：仅同源 iframe 内嵌
  location ~ ^/api/m2/artifact-preview$ {
    proxy_http_version 1.1;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Origin $http_origin;
    proxy_set_header Referer $http_referer;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_set_header Connection "";
    proxy_pass http://api-gateway:8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  location ~ ^/api/m2/artifact$ {
    proxy_http_version 1.1;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Origin $http_origin;
    proxy_set_header Referer $http_referer;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_set_header Connection "";
    proxy_pass http://api-gateway:8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Origin $http_origin;
    proxy_set_header Referer $http_referer;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_set_header Connection "";
    proxy_pass http://api-gateway:8080;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
